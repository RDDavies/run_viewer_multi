<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PhasedApproach | RunViewerMulti</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --panel: #161b22; --border: #30363d;
  --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
  --green: #2ea043; --red: #f85149; --orange: #f0883e; --yellow: #d29922;
}
html, body { height: 100%; background: var(--bg); color: var(--text);
             font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

/* ── Header ── */
#header {
  display: flex; align-items: stretch;
  background: var(--panel); border-bottom: 1px solid var(--border);
  height: 200px; flex-shrink: 0; overflow: hidden;
}
#header-logo {
  width: 190px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; border-right: 1px solid var(--border);
  color: #ffffff;
}
#header-logo svg { width: 100%; height: 100%; }
#header-right {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 0;
  padding: 14px 14px 10px;
}
#header-top {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
#header h1 { font-size: 15px; font-weight: 700; letter-spacing: 2px;
             color: var(--text); white-space: nowrap; flex-shrink: 0;
             text-transform: uppercase; }
#pills-wrap { display: flex; gap: 6px; flex-shrink: 0; overflow-x: auto;
              align-items: center; min-width: 0; padding: 4px 0;
              scrollbar-width: none; }
#pills-wrap::-webkit-scrollbar { display: none; }
.rpill {
  display: flex; align-items: center; gap: 5px;
  border: 1.5px solid; border-radius: 20px;
  padding: 3px 8px 3px 6px; flex-shrink: 0;
  background: rgba(255,255,255,.04); font-size: 12px;
}
.rpill-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.rpill-name { max-width: 110px; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; color: var(--text); }
.rpill-lap {
  background: transparent; border: none; color: var(--muted);
  font-size: 11px; cursor: pointer; padding: 0 2px;
}
.rpill-lap option { background: var(--panel); }
.rpill-del {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 14px; line-height: 1; padding: 0 2px; margin-left: 1px;
}
.rpill-del:hover { color: var(--red); }
#add-btn {
  flex-shrink: 0; padding: 5px 12px; background: var(--accent);
  color: #000; border: none; border-radius: 6px; font-weight: 600;
  cursor: pointer; font-size: 12px;
}
#add-btn:hover { opacity: .85; }
#clear-btn {
  flex-shrink: 0; padding: 5px 12px; background: transparent;
  color: var(--red); border: 1px solid var(--red); border-radius: 6px; font-weight: 600;
  cursor: pointer; font-size: 12px; transition: all .15s;
}
#clear-btn:hover:not(:disabled) { background: rgba(248,81,73,.15); }
#clear-btn:disabled { opacity: .3; cursor: default; }
#help-btn {
  flex-shrink: 0; padding: 5px 10px; background: transparent;
  color: var(--muted); border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; font-size: 12px; font-weight: 600; transition: all .15s;
  text-decoration: none; display: flex; align-items: center; gap: 5px;
}
#help-btn:hover { background: var(--border); color: var(--text); }
#file-input { display: none; }

/* ── Header drop zone ── */
#header-drop {
  flex: 1; min-height: 0;
  border: 1.5px dashed var(--border); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  gap: 8px; color: var(--muted); font-size: 11px;
  cursor: default; transition: all .2s;
  margin: 4px 0; user-select: none;
}
#header-drop svg { opacity: .5; flex-shrink: 0; }
#header-drop.dragover {
  border-color: var(--accent); border-style: solid;
  background: rgba(88,166,255,.07); color: var(--accent);
}
#header-drop.dragover svg { opacity: 1; }

/* ── Layout ── */
#body { display: flex; flex-direction: column; height: calc(100vh - 200px - 52px - 34px); }
#content { display: flex; flex: 1; overflow: hidden; }
#map { flex: 2; min-width: 0; }

/* ── Right panel ── */
#panel {
  flex: 1; min-width: 260px; background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel-sec { border-bottom: 1px solid var(--border); }
.panel-sec-title {
  font-size: 10px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; color: var(--muted);
  padding: 6px 10px 4px;
}

/* ── Run rows ── */
#run-rows { flex-shrink: 0; overflow: hidden; }
.rrow {
  display: flex; flex-direction: column;
  padding: 7px 10px 6px;
  border-bottom: 1px solid rgba(48,54,61,.5);
  gap: 5px;
}
.rrow-body { display: flex; flex-direction: column; gap: 4px; }
.rrow-top { display: flex; align-items: center; gap: 8px; }
.rrow-stripe { width: 3px; border-radius: 2px; align-self: stretch; flex-shrink: 0; }
.rrow-name { font-size: 11px; font-weight: 600; color: var(--text);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.rrow-mph { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;
            line-height: 1; flex-shrink: 0; }
.rrow-mph-unit { font-size: 9px; color: var(--muted); font-weight: 400; }
.rrow-gear { font-size: 26px; font-weight: 900; color: var(--orange);
             text-align: center; line-height: 1; font-variant-numeric: tabular-nums;
             flex-shrink: 0; min-width: 24px; }
.rrow-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
.rrow-rpm { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rrow-delta { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rrow-bot { display: flex; flex-direction: column; gap: 3px; }
.bar-row { display: flex; align-items: center; gap: 6px; }
.bar-label { font-size: 9px; color: var(--muted); width: 24px; flex-shrink: 0; letter-spacing: .5px; }
.bar-track { flex: 1; height: 7px; background: #1c2128; border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; width: 0; border-radius: 3px; transition: width .05s; }
.bar-thr { background: var(--green); }
.bar-brk { background: var(--red); }
.bar-pct { font-size: 10px; font-variant-numeric: tabular-nums; width: 32px;
           text-align: right; flex-shrink: 0; }
.rrow-sector { font-size: 10px; color: var(--muted); text-align: right; }
/* legacy aliases kept for safety */
.mini-bar-wrap { display: none; }
.mini-bar-track { height: 5px; background: #1c2128; border-radius: 2px; overflow: hidden; }
.mini-bar-fill { height: 100%; width: 0; border-radius: 2px; transition: width .05s; }
.mb-thr { background: var(--green); }
.mb-brk { background: var(--red); }

/* ── Sector table ── */
#sector-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#sector-scroll { flex: 1; overflow: auto; }
#sector-msg { font-size: 11px; color: var(--muted); padding: 10px 10px; line-height: 1.5; }
#stbl { width: 100%; border-collapse: collapse; font-size: 11px; }
#stbl th { position: sticky; top: 0; background: var(--panel);
           padding: 4px 6px; text-align: right; font-weight: 600;
           border-bottom: 1px solid var(--border); white-space: nowrap; }
#stbl th:first-child { text-align: left; min-width: 28px; }
#stbl td { padding: 3px 6px; text-align: right; border-bottom: 1px solid rgba(48,54,61,.4);
           font-variant-numeric: tabular-nums; white-space: nowrap; }
#stbl td:first-child { text-align: left; color: var(--muted); font-weight: 600; }
#stbl .sc-best { font-weight: 700; }
#stbl .sc-active { background: rgba(255,255,255,.06); }
#stbl .sc-delta { font-size: 10px; display: block; }
#stbl .sc-delta.pos { color: var(--red); }
#stbl .sc-delta.neg { color: var(--green); }
#stbl .sc-dist { font-size: 9px; color: var(--muted); display: block; margin-top: 1px; }
#stbl .total-row td { border-top: 1px solid var(--border);
                       border-bottom: none; font-weight: 600; padding-top: 5px; }

/* ── G-force ── */
#gforce-sec { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
              padding: 4px 0 6px; }
#gforce-canvas { width: 160px; height: 160px; background: #0a0e14; border-radius: 4px; }

/* ── Baseline selector ── */
#baseline-wrap { display: flex; align-items: center; gap: 6px; padding: 2px 10px 6px; flex-wrap: wrap; }
#baseline-wrap label { font-size: 10px; color: var(--muted); white-space: nowrap; }
#baseline-select {
  flex: 1; min-width: 0; font-size: 11px; background: #1c2128; color: var(--text);
  border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; cursor: pointer;
}
#baseline-select:focus { outline: none; border-color: var(--accent); }

/* ── Trim bar ── */
#trim-bar {
  height: 34px; flex-shrink: 0; background: #0d1117;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; padding: 0 14px;
}
.trim-btn {
  padding: 3px 9px; border: 1px solid var(--border); background: transparent;
  color: var(--muted); border-radius: 4px; cursor: pointer; font-size: 11px;
  transition: all .15s; white-space: nowrap; flex-shrink: 0;
}
.trim-btn:hover:not(:disabled) { background: var(--border); color: var(--text); }
.trim-btn:disabled { opacity: .3; cursor: default; }
#trim-start-btn  { border-color: var(--green); color: var(--green); }
#trim-start-btn:hover:not(:disabled) { background: rgba(57,211,83,.12); }
#trim-finish-btn { border-color: var(--red); color: var(--red); }
#trim-finish-btn:hover:not(:disabled) { background: rgba(248,81,73,.12); }
.trim-disp { font-size: 11px; font-variant-numeric: tabular-nums;
             min-width: 52px; color: var(--muted); }
#trim-start-disp.set  { color: var(--green); }
#trim-finish-disp.set { color: var(--red); }
.trim-sep { color: var(--border); flex-shrink: 0; }
#trim-reset-btn { margin-left: auto; }

/* ── Controls ── */
#controls {
  height: 52px; background: var(--panel); border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; padding: 0 14px;
}
.ctrl-btn {
  padding: 5px 11px; border: 1px solid var(--border); background: transparent;
  color: var(--text); border-radius: 6px; cursor: pointer; font-size: 13px;
  transition: all .15s; white-space: nowrap; flex-shrink: 0;
}
.ctrl-btn:hover { background: var(--border); }
.ctrl-btn:disabled { opacity: .3; cursor: default; }
#play-btn { border-color: var(--accent); color: var(--accent); }
#play-btn.playing { border-color: var(--yellow); color: var(--yellow); }
#time-slider { flex: 1; accent-color: var(--accent); cursor: pointer; min-width: 0; }
.time-disp { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
             white-space: nowrap; min-width: 66px; text-align: center; }
.spd-btns { display: flex; gap: 3px; flex-shrink: 0; }
.spd-btn {
  padding: 3px 7px; border: 1px solid var(--border); background: transparent;
  color: var(--muted); border-radius: 4px; cursor: pointer; font-size: 11px;
}
.spd-btn.active { border-color: var(--accent); color: var(--accent);
                  background: rgba(88,166,255,.1); }

/* ── Map overlays ── */
#map-toggle {
  position: absolute; top: 10px; right: 10px; z-index: 1000;
  background: rgba(22,27,34,.85); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px; font-size: 12px;
  color: var(--text); cursor: pointer; backdrop-filter: blur(4px);
}
.sec-marker {
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(255,215,0,.92); border: 2px solid #000;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 900; color: #000;
  box-shadow: 0 1px 5px rgba(0,0,0,.7);
}

/* ── Upload overlay ── */
#overlay {
  position: fixed; inset: 0; background: rgba(13,17,23,.93);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; flex-direction: column; gap: 14px;
}
#overlay.hidden { display: none; }
.drop-zone {
  border: 2px dashed var(--accent); border-radius: 16px;
  padding: 44px 60px; text-align: center; cursor: pointer; transition: all .2s;
}
.drop-zone.dragover { background: rgba(88,166,255,.08); border-style: solid; }
.drop-icon { font-size: 44px; margin-bottom: 14px; }
.drop-title { font-size: 19px; font-weight: 600; margin-bottom: 6px; }
.drop-sub { font-size: 13px; color: var(--muted); }
#progress-msg { font-size: 13px; color: var(--yellow); min-height: 18px; }
#sample-btn {
  padding: 9px 24px; background: transparent;
  color: var(--muted); border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .2s; letter-spacing: .4px;
}
#sample-btn:hover { background: var(--border); color: var(--text); }
#sample-btn:disabled { opacity: .4; cursor: default; }

/* ════════════════════════════════════════════════════════
   RESPONSIVE — Tablet  768 – 1023 px
   Side-by-side layout is kept; header height is reduced.
════════════════════════════════════════════════════════ */
@media (max-width: 1023px) and (min-width: 768px) {
  #header       { height: 130px; }
  #header-logo  { width: 130px; padding: 14px; }
  #body         { height: calc(100vh - 130px - 52px - 34px); }
  #header h1    { font-size: 13px; letter-spacing: 1.5px; }
  #header-drop  { margin: 2px 0; }
}

/* ════════════════════════════════════════════════════════
   RESPONSIVE — Mobile  < 768 px
   Stacked layout; page scrolls; touch-friendly targets.
════════════════════════════════════════════════════════ */
@media (max-width: 767px) {

  /* Page scroll */
  html, body { height: auto; overflow-x: hidden; overflow-y: auto; }

  /* ── Header ── */
  #header {
    height: auto; min-height: 56px;
    align-items: flex-start; overflow: visible;
  }
  #header-logo {
    width: 54px; padding: 10px 12px; flex-shrink: 0;
    align-self: stretch; align-items: flex-start; padding-top: 12px;
  }
  #header-right { padding: 8px 10px 6px; gap: 3px; }
  #header-top   { gap: 5px; flex-wrap: nowrap; }
  #header h1    { font-size: 10px; letter-spacing: 1px; }

  /* Collapse the drag-drop zone — not useful on touch devices */
  #header-drop  { display: none; }

  /* Tighter buttons */
  #add-btn   { padding: 6px 10px; font-size: 11px; }
  #clear-btn { padding: 6px 10px; font-size: 11px; }
  #help-btn  { padding: 6px 8px;  font-size: 11px; }

  /* Pill names slightly narrower */
  .rpill-name { max-width: 72px; }

  /* ── Body / content layout ── */
  #body    { height: auto; flex-direction: column; overflow: visible; }
  #content { flex-direction: column; overflow: visible; height: auto; }

  /* ── Map ── */
  #map { flex: none; height: 45vh; min-height: 220px; }

  /* ── Panel ── */
  #panel {
    flex: none; min-width: 0;
    border-left: none; border-top: 1px solid var(--border);
    overflow: visible;
  }

  /* Run rows — allow horizontal scroll when ≥ 3 runs */
  #run-rows { overflow-x: auto; overflow-y: hidden; }
  .rrow     { min-width: 200px; }

  /* Sector table — bounded height, both-axis scroll */
  #sector-wrap   { flex: none; height: auto; }
  #sector-scroll { max-height: 240px; }

  /* Shrink G-force canvas slightly */
  #gforce-canvas { width: 120px; height: 120px; }

  /* ── Trim bar ── */
  #trim-bar {
    height: auto; min-height: 36px;
    flex-wrap: wrap; padding: 6px 10px; row-gap: 5px;
  }
  #trim-reset-btn { margin-left: 0; }

  /* ── Playback controls ── */
  #controls {
    height: auto; min-height: 44px;
    flex-wrap: wrap; padding: 8px 10px; row-gap: 6px;
  }
  /* Push the slider to a full-width second row */
  #time-slider { order: 10; flex-basis: 100%; }
  .time-disp   { min-width: 0; font-size: 11px; }
  /* Slightly larger touch targets on buttons */
  .ctrl-btn  { padding: 7px 12px; }
  .spd-btn   { padding: 5px 8px; }

  /* ── Upload overlay ── */
  .drop-zone {
    padding: 28px 20px;
    width: min(90vw, 340px);
    border-radius: 12px;
  }
  .drop-icon svg { width: 90px !important; height: 90px !important; }
  .drop-title    { font-size: 16px; }
  .drop-sub      { font-size: 12px; }
  #sample-btn    { font-size: 12px; padding: 8px 20px; }
}
</style>
</head>

<script>
/* ════════════════════════════════════════════════════════
   CONSTANTS & STATE
════════════════════════════════════════════════════════ */
const RUN_COLORS = ['#00bfff','#ff8c00','#39d353','#bf91f3',
                    '#ff6b9d','#ffd700','#00ff9f','#ff4500'];
const MAX_SECTORS = 12;
let ridCounter = 0;

let runs = [];            // Run objects (see structure below)
let sectors = [];         // [{lat, lon}] — cluster centroids
let sectorMarkers = [];   // Leaflet marker objects
let syncedTime = 0;       // current playback position in ms (lap-zeroed)
let maxDuration = 0;      // max lap duration across all active runs
let isPlaying = false, playbackSpeed = 1;
let rafId = null, lastTs = null, sliderDragging = false;
let globalMaxBrk = 10000, globalMaxRpm = 9000;
const gHistories = {};    // rid → [{x,y}]
const G_HIST = 60;
let baselineRunId  = null; // null = auto (fastest), else a run id
let trimStartPos   = null; // {lat, lon} captured from baseline run, or null
let trimFinishPos  = null; // {lat, lon} captured from baseline run, or null
let trimStartLabel = null; // display string for UI (time when captured)
let trimFinishLabel= null;

/* ════════════════════════════════════════════════════════
   CSV PARSING (identical to single-run version)
════════════════════════════════════════════════════════ */
const COL_MAP = {
  'LAT (deg)':'lat','LONG (deg)':'lon','SPEED (m/s)':'spd','RPM':'rpm',
  'THROTTLE (%)':'thr','BRAKES (kPa)':'brk','STEERING (deg)':'str',
  'GEAR_NUMBER':'gear','MATH_ELAPSED_TIME':'t','MATH_LAP_NUMBER':'lap',
  'MATH_CALC_ACCEL_X':'cax','MATH_CALC_ACCEL_Y':'cay',
  'ACCEL_X (m/s^2)':'ax','ACCEL_Y (m/s^2)':'ay',
};

function parseRunCSV(text) {
  const firstNL = text.indexOf('\n');
  const headers = text.substring(0, firstNL).replace(/\r$/,'').split(',');
  const idxMap = {};
  for (const [csv, short] of Object.entries(COL_MAP)) {
    const i = headers.indexOf(csv); if (i >= 0) idxMap[short] = i;
  }
  const data = []; let pos = firstNL + 1;
  while (pos < text.length) {
    let end = text.indexOf('\n', pos); if (end < 0) end = text.length;
    const line = text.substring(pos, end).replace(/\r$/,''); pos = end + 1;
    if (!line) continue;
    const vals = line.split(',');
    const pt = {}; let ok = false;
    for (const [short, idx] of Object.entries(idxMap)) {
      const v = +vals[idx];
      if (!isNaN(v)) { pt[short] = v; if (short==='lat'||short==='lon') ok=true; }
    }
    if (ok) data.push(pt);
  }
  return data;
}

function processData(raw) {
  if (!raw.length) return raw;
  const t0 = raw[0].t ?? 0;
  raw.forEach(d => { d.t = (d.t ?? 0) - t0; });
  raw.forEach(d => {
    d.mph = d.spd != null ? Math.round(d.spd * 223.694) / 100 : 0; delete d.spd;
  });
  raw.forEach(d => {
    const ax = d.cax ?? d.ax ?? null, ay = d.cay ?? d.ay ?? null;
    if (ax != null) d.glat = Math.round(ax / 9.81 * 1000) / 1000;
    if (ay != null) d.glon = Math.round(ay / 9.81 * 1000) / 1000;
    delete d.cax; delete d.cay; delete d.ax; delete d.ay;
  });
  return raw;
}

/* ════════════════════════════════════════════════════════
   LAP EXTRACTION
════════════════════════════════════════════════════════ */
function extractLaps(data) {
  const hasLap = data.some(d => d.lap != null && !isNaN(d.lap));
  if (!hasLap) return [{ num: 'Full', data }];
  const map = new Map();
  for (const d of data) {
    const n = Math.round(d.lap ?? 1);
    if (!map.has(n)) map.set(n, []);
    map.get(n).push(d);
  }
  return [...map.entries()]
    .sort((a,b) => a[0]-b[0])
    .map(([num, pts]) => ({ num, data: pts }))
    .filter(l => l.data.length > 20);
}

/* ════════════════════════════════════════════════════════
   RUN HELPERS
════════════════════════════════════════════════════════ */
function getLapT(run, i) { return run.lapData[i].t - run.lapT0; }
function runT(r) { return Math.min(Math.max(syncedTime - r.timeOffset, 0), r.lapDuration); }

function findLapIdx(run, targetLt) {
  const target = targetLt + run.lapT0;
  const ld = run.lapData; let lo = 0, hi = ld.length - 1;
  while (lo < hi) { const m=(lo+hi+1)>>1; if(ld[m].t<=target) lo=m; else hi=m-1; }
  return lo;
}

function setRunLap(run, lapIdx) {
  run.selectedLapIdx = lapIdx;
  run.lapData = run.laps[lapIdx].data;
  run.lapT0 = run.lapData[0].t;
  run.lapDuration = run.lapData[run.lapData.length - 1].t - run.lapT0;
  run.currentIdx = 0;
  run.timeOffset = 0;
  run.sectorTimes = [];
  gHistories[run.id] = [];
}

function getFastestRun() {
  return runs.reduce((b, r) => (r.lapDuration < (b?.lapDuration ?? Infinity) ? r : b), null);
}
function getBaselineRun() {
  if (baselineRunId) return runs.find(r => r.id === baselineRunId) ?? getFastestRun();
  return getFastestRun();
}
function setBaseline(id) {
  baselineRunId = id || null;
  renderSectorTable();
  if (runs.length) updateAllDisplays();
}

/* ════════════════════════════════════════════════════════
   TRIM CONTROLS  (location-based)
════════════════════════════════════════════════════════ */
function findClosestIdx(data, lat, lon) {
  let best = 0, bestDist = Infinity;
  for (let i = 0; i < data.length; i++) {
    const dlat = data[i].lat - lat, dlon = data[i].lon - lon;
    const d = dlat*dlat + dlon*dlon;
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return best;
}

function setTrimStart() {
  const base = getBaselineRun();
  if (!base) return;
  const d = base.lapData[base.currentIdx];
  trimStartPos   = { lat: d.lat, lon: d.lon };
  trimStartLabel = fmtTime(getLapT(base, base.currentIdx));
  // If the new start is at or beyond the finish, clear finish
  if (trimFinishPos) {
    const full = base.laps[base.selectedLapIdx].data;
    const si = findClosestIdx(full, trimStartPos.lat,  trimStartPos.lon);
    const fi = findClosestIdx(full, trimFinishPos.lat, trimFinishPos.lon);
    if (si >= fi) { trimFinishPos = null; trimFinishLabel = null; }
  }
  applyTrim();
}

function setTrimFinish() {
  const base = getBaselineRun();
  if (!base) return;
  const d = base.lapData[base.currentIdx];
  trimFinishPos   = { lat: d.lat, lon: d.lon };
  trimFinishLabel = fmtTime(getLapT(base, base.currentIdx));
  // If the new finish is at or before the start, clear start
  if (trimStartPos) {
    const full = base.laps[base.selectedLapIdx].data;
    const si = findClosestIdx(full, trimStartPos.lat,  trimStartPos.lon);
    const fi = findClosestIdx(full, trimFinishPos.lat, trimFinishPos.lon);
    if (fi <= si) { trimStartPos = null; trimStartLabel = null; }
  }
  applyTrim();
}

function resetTrim() {
  trimStartPos = null; trimFinishPos = null;
  trimStartLabel = null; trimFinishLabel = null;
  applyTrim();
}

function applyTrim() {
  runs.forEach(r => {
    const full = r.laps[r.selectedLapIdx].data;
    let si = 0, fi = full.length - 1;
    if (trimStartPos)  si = findClosestIdx(full, trimStartPos.lat,  trimStartPos.lon);
    if (trimFinishPos) fi = findClosestIdx(full, trimFinishPos.lat, trimFinishPos.lon);
    if (si >= fi) { si = 0; fi = full.length - 1; } // guard invalid range
    r.lapData    = full.slice(si, fi + 1);
    r.lapT0      = r.lapData[0].t;
    r.lapDuration= r.lapData[r.lapData.length - 1].t - r.lapT0;
    r.currentIdx = 0;
    r.timeOffset = 0;
    gHistories[r.id] = [];
  });
  syncedTime = 0;
  runs.forEach(r => buildRunTrack(r));
  recomputeGlobalMeta();
  recomputeAllSectorTimes();
  renderSectorTable();
  runs.forEach(r => { r.currentIdx = findLapIdx(r, Math.min(syncedTime, r.lapDuration)); });
  if (runs.length) updateAllDisplays();
  updateTrimUI();
}

function updateTrimUI() {
  const hasRuns = runs.length > 0;
  const trimActive = trimStartPos !== null || trimFinishPos !== null;
  const startBtn   = document.getElementById('trim-start-btn');
  const finishBtn  = document.getElementById('trim-finish-btn');
  const resetBtn   = document.getElementById('trim-reset-btn');
  const startDisp  = document.getElementById('trim-start-disp');
  const finishDisp = document.getElementById('trim-finish-disp');
  if (startBtn)   startBtn.disabled  = !hasRuns;
  if (finishBtn)  finishBtn.disabled = !hasRuns;
  if (resetBtn)   resetBtn.disabled  = !trimActive;
  if (startDisp) {
    startDisp.textContent = trimStartLabel  ?? '—';
    startDisp.className   = 'trim-disp' + (trimStartPos  ? ' set' : '');
  }
  if (finishDisp) {
    finishDisp.textContent = trimFinishLabel ?? '—';
    finishDisp.className   = 'trim-disp' + (trimFinishPos ? ' set' : '');
  }
}

function recomputeGlobalMeta() {
  globalMaxBrk = 1; globalMaxRpm = 1;
  for (const r of runs) for (const d of r.lapData) {
    if ((d.brk||0) > globalMaxBrk) globalMaxBrk = d.brk;
    if ((d.rpm||0) > globalMaxRpm) globalMaxRpm = d.rpm;
  }
  globalMaxBrk = Math.max(globalMaxBrk, 500);
  globalMaxRpm = Math.max(globalMaxRpm, 9000);
  maxDuration = Math.max(...runs.map(r => r.lapDuration), 0);
  const sl = document.getElementById('time-slider');
  sl.min = 0;
  sl.max = maxDuration;
  sl.value = Math.min(syncedTime, maxDuration);
}

/* ════════════════════════════════════════════════════════
   SECTOR DETECTION
════════════════════════════════════════════════════════ */
// Detect where drivers apply throttle after braking — these
// become the sector measurement gates on the track.
function detectSectors() {
  const ON_THR  = 55,  OFF_THR  = 15;
  const MIN_OFF_MS = 400, MIN_SEP_MS = 2500;
  const CLUSTER_DEG = 0.0005; // ~50 m

  const allEvents = [];
  for (const run of runs) {
    const ld = run.lapData;
    let offSince = null, lastEvt = -Infinity;
    for (let i = 1; i < ld.length; i++) {
      const thr = ld[i].thr ?? 0, prev = ld[i-1].thr ?? 0;
      const lt = getLapT(run, i);
      if (prev >= OFF_THR && thr < OFF_THR) offSince = lt;
      if (prev <= ON_THR && thr > ON_THR && offSince !== null) {
        if (lt - offSince >= MIN_OFF_MS && lt - lastEvt >= MIN_SEP_MS) {
          allEvents.push({ lat: ld[i].lat, lon: ld[i].lon, lt });
          lastEvt = lt;
        }
        offSince = null;
      }
    }
  }

  // Greedy GPS clustering
  const clusters = [];
  for (const ev of allEvents) {
    let best = null, bestD = Infinity;
    for (const cl of clusters) {
      const d = Math.hypot(cl.lat - ev.lat, cl.lon - ev.lon);
      if (d < CLUSTER_DEG && d < bestD) { bestD = d; best = cl; }
    }
    if (best) {
      best.events.push(ev);
      best.lat = best.events.reduce((s,e)=>s+e.lat,0)/best.events.length;
      best.lon = best.events.reduce((s,e)=>s+e.lon,0)/best.events.length;
    } else {
      clusters.push({ lat: ev.lat, lon: ev.lon, events: [ev] });
    }
  }

  if (!clusters.length) { sectors = []; return; }

  // Sort clusters by order in the first run (track position)
  const ref = runs[0];
  clusters.forEach(cl => { cl.refIdx = findNearestMapIdx(ref.lapData, cl.lat, cl.lon); });
  clusters.sort((a,b) => a.refIdx - b.refIdx);

  // If > MAX_SECTORS, keep the ones with the most votes (run coverage)
  let chosen = clusters;
  if (chosen.length > MAX_SECTORS) {
    chosen = [...clusters].sort((a,b) => b.events.length - a.events.length)
                          .slice(0, MAX_SECTORS)
                          .sort((a,b) => a.refIdx - b.refIdx);
  }

  sectors = chosen.map(cl => ({ lat: cl.lat, lon: cl.lon }));
}

function findNearestMapIdx(lapData, lat, lon) {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < lapData.length; i++) {
    const d = (lapData[i].lat-lat)**2 + (lapData[i].lon-lon)**2;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

/* ════════════════════════════════════════════════════════
   SECTOR TIMES PER RUN
════════════════════════════════════════════════════════ */
function sectorDistanceM(lapData, startIdx, endIdx) {
  let dist = 0;
  for (let i = startIdx; i < endIdx && i + 1 < lapData.length; i++) {
    const dlat = (lapData[i+1].lat - lapData[i].lat) * 111000;
    const dlon = (lapData[i+1].lon - lapData[i].lon) * 111000
                 * Math.cos(lapData[i].lat * Math.PI / 180);
    dist += Math.sqrt(dlat*dlat + dlon*dlon);
  }
  return dist;
}

function fmtDist(m) {
  const ft = m * 3.28084;
  return ft >= 5280 ? (ft/5280).toFixed(2)+'mi' : Math.round(ft)+'ft';
}

function computeRunSectorTimes(run) {
  if (!sectors.length) { run.sectorTimes = []; return; }
  const ld = run.lapData, n = ld.length;
  const gateIdxs = sectors.map(s => findNearestMapIdx(ld, s.lat, s.lon));
  const gates = [0, ...gateIdxs, n-1];
  const times = [];
  for (let i = 0; i < gates.length - 1; i++) {
    const t1 = getLapT(run, gates[i]), t2 = getLapT(run, gates[i+1]);
    times.push({
      t_start: t1, t_end: t2, duration: t2 - t1,
      distM: sectorDistanceM(ld, gates[i], gates[i+1])
    });
  }
  run.sectorTimes = times;
}

function recomputeAllSectorTimes() {
  detectSectors();
  for (const run of runs) computeRunSectorTimes(run);
  placeSectorMarkers();
  renderSectorTable();
}

/* ════════════════════════════════════════════════════════
   LEAFLET MAP
════════════════════════════════════════════════════════ */
const cartoTile = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  { attribution: '© OSM © CARTO', maxZoom: 19 });
const satTile = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Tiles © Esri', maxZoom: 19 });
const map = L.map('map', { layers: [cartoTile] });
let usingSat = false;

// Re-flow map when device rotates or browser is resized
window.addEventListener('resize', () => map.invalidateSize());

function toggleTiles() {
  if (usingSat) { map.removeLayer(satTile); map.addLayer(cartoTile);
    document.getElementById('map-toggle').textContent='🛰 Satellite'; }
  else { map.removeLayer(cartoTile); map.addLayer(satTile);
    document.getElementById('map-toggle').textContent='🗺 Dark Map'; }
  usingSat = !usingSat;
}

const trackLayer = L.layerGroup().addTo(map);
const markerLayer = L.layerGroup().addTo(map);
const sectorLayer = L.layerGroup().addTo(map);

map.on('click', function(e) {
  if (!runs.length) return;
  if (isPlaying) { isPlaying = false; lastTs = null; cancelAnimationFrame(rafId); updatePlayBtn(); }
  // Anchor syncedTime to the baseline run's closest point
  const base = getBaselineRun() || runs[0];
  const baseIdx = findClosestIdx(base.lapData, e.latlng.lat, e.latlng.lng);
  syncedTime = getLapT(base, baseIdx);
  // Each run independently seeks to its own closest GPS point,
  // storing an offset so playback stays location-aligned
  runs.forEach(r => {
    const idx = findClosestIdx(r.lapData, e.latlng.lat, e.latlng.lng);
    r.currentIdx  = idx;
    r.timeOffset  = syncedTime - getLapT(r, idx);
    gHistories[r.id] = [];
  });
  document.getElementById('time-slider').value = syncedTime;
  updateAllDisplays();
});

function buildRunTrack(run) {
  run.polylines.forEach(p => trackLayer.removeLayer(p));
  run.polylines = [];
  if (run.lapData.length >= 2) {
    const cv = L.canvas({ padding: 0.5 });
    const line = L.polyline(run.lapData.map(d => [d.lat, d.lon]),
      { color: run.color, weight: 3, opacity: 0.75, renderer: cv })
      .addTo(trackLayer);
    run.polylines.push(line);
  }

  // Marker
  if (run.marker) markerLayer.removeLayer(run.marker);
  const icon = L.divIcon({
    html: `<div style="width:13px;height:13px;background:${run.color};border:2px solid #fff;
                       border-radius:50%;box-shadow:0 0 6px ${run.color};"></div>`,
    iconSize:[13,13], iconAnchor:[6,6], className:''
  });
  run.marker = L.marker([run.lapData[0].lat, run.lapData[0].lon], { icon })
                 .addTo(markerLayer);
}

function fitMapToAllRuns() {
  if (!runs.length) return;
  const lats = runs.flatMap(r => r.lapData.map(d => d.lat));
  const lons = runs.flatMap(r => r.lapData.map(d => d.lon));
  map.fitBounds([[Math.min(...lats),Math.min(...lons)],
                 [Math.max(...lats),Math.max(...lons)]], { padding:[24,24] });
}

function placeSectorMarkers() {
  sectorLayer.clearLayers();
  sectorMarkers = [];
  sectors.forEach((s, i) => {
    const icon = L.divIcon({
      html: `<div class="sec-marker">${i+1}</div>`,
      iconSize:[20,20], iconAnchor:[10,10], className:''
    });
    const m = L.marker([s.lat, s.lon], { icon }).addTo(sectorLayer);
    sectorMarkers.push(m);
  });
}

/* ════════════════════════════════════════════════════════
   SECTOR TABLE RENDERING
════════════════════════════════════════════════════════ */
function renderSectorTable() {
  const msg  = document.getElementById('sector-msg');
  const tbl  = document.getElementById('stbl');
  const info = document.getElementById('sec-info');
  const blWrap = document.getElementById('baseline-wrap');
  const blSel  = document.getElementById('baseline-select');

  // Sync baseline selector options
  if (blSel) {
    const prev = blSel.value;
    blSel.innerHTML = '<option value="">Auto (fastest)</option>'
      + runs.map(r => `<option value="${r.id}">${r.filename.replace(/\.csv$/i,'')}</option>`).join('');
    blSel.value = runs.find(r => r.id === prev) ? prev : '';
    if (!blSel.value) baselineRunId = null;
  }

  if (!runs.length) {
    msg.style.display='none'; tbl.style.display='none';
    if (blWrap) blWrap.style.display='none';
    return;
  }
  if (!sectors.length) {
    const hasThr = runs.some(r => r.lapData.some(d => d.thr != null));
    msg.textContent = hasThr
      ? 'No sector boundaries detected. Try loading runs with more varied throttle/brake usage.'
      : 'Throttle data not available for sector detection.';
    msg.style.display='block'; tbl.style.display='none';
    if (blWrap) blWrap.style.display='none';
    info.textContent=''; return;
  }

  if (blWrap) blWrap.style.display = runs.length >= 2 ? 'flex' : 'none';

  const base = getBaselineRun();
  const N = runs[0].sectorTimes.length;
  info.textContent = `${sectors.length} boundaries · ${N} sectors`;
  msg.style.display='none'; tbl.style.display='';

  // Per-sector absolute fastest time and shortest distance
  const sectorFastest  = Array.from({length: N}, (_, i) =>
    Math.min(...runs.map(r => r.sectorTimes[i]?.duration ?? Infinity)));
  const sectorShortest = Array.from({length: N}, (_, i) =>
    Math.min(...runs.map(r => r.sectorTimes[i]?.distM ?? Infinity)));

  let h = '<thead><tr><th>Sec</th>';
  runs.forEach(r => {
    const isBase = r === base;
    h += `<th style="color:${r.color}">${shortName(r.filename)}`
       + `${isBase ? '<span style="font-size:9px;color:var(--muted);font-weight:400"> ★base</span>' : ''}</th>`;
  });
  h += '</tr></thead><tbody>';

  for (let i = 0; i < N; i++) {
    h += `<tr data-sec="${i}"><td>S${i+1}</td>`;
    const baseSt = base?.sectorTimes[i];
    runs.forEach(r => {
      const st = r.sectorTimes[i];
      if (!st) { h += `<td data-sc-rid="${r.id}" data-sc-idx="${i}">—</td>`; return; }
      const isBest = Math.abs(st.duration - sectorFastest[i]) < 1;
      const isBase = r === base;
      let dStr = '';
      if (!isBase && baseSt) {
        const delta = st.duration - baseSt.duration;
        if (Math.abs(delta) > 0.5) {
          const cls = delta > 0 ? 'pos' : 'neg';
          const sign = delta > 0 ? '+' : '';
          dStr = `<span class="sc-delta ${cls}">${sign}${(delta/1000).toFixed(3)}</span>`;
        }
      }
      const isShortest = st.distM != null && Math.abs(st.distM - sectorShortest[i]) < 0.5;
      let distStr = '';
      if (st.distM != null) {
        if (isShortest) {
          distStr = `<span class="sc-dist" style="color:var(--green)">(${fmtDist(st.distM)})</span>`;
        } else {
          const diff = st.distM - sectorShortest[i];
          distStr = `<span class="sc-dist" style="color:var(--red)">(+${fmtDist(diff)})</span>`;
        }
      }
      h += `<td class="${isBest ? 'sc-best' : ''}" `
         + `data-sc-rid="${r.id}" data-sc-idx="${i}" `
         + `style="color:${isBest ? r.color : 'var(--muted)'}">`
         + `${(st.duration/1000).toFixed(3)}${dStr}${distStr}</td>`;
    });
    h += '</tr>';
  }

  // Total / lap row
  h += '<tr class="total-row"><td>LAP</td>';
  const fastestTotal = Math.min(...runs.map(r => r.lapDuration));
  const baseLap = base?.lapDuration;
  runs.forEach(r => {
    const isBest  = Math.abs(r.lapDuration - fastestTotal) < 1;
    const isBase  = r === base;
    let dStr = '';
    if (!isBase && baseLap) {
      const delta = r.lapDuration - baseLap;
      if (Math.abs(delta) > 0.5) {
        const cls  = delta > 0 ? 'pos' : 'neg';
        const sign = delta > 0 ? '+' : '';
        dStr = `<span class="sc-delta ${cls}">${sign}${(delta/1000).toFixed(3)}</span>`;
      }
    }
    const totalDist = r.sectorTimes.reduce((s, st) => s + (st.distM ?? 0), 0);
    const shortestTotal = Math.min(...runs.map(r2 => r2.sectorTimes.reduce((s,st) => s+(st.distM??0),0)));
    const isTotalShortest = totalDist > 0 && Math.abs(totalDist - shortestTotal) < 0.5;
    const totalDistStr = totalDist > 0
      ? `<span class="sc-dist"${isTotalShortest ? ' style="color:var(--green)"' : ''}>(${fmtDist(totalDist)})</span>`
      : '';
    h += `<td style="color:${isBest ? r.color : 'var(--muted)'}">`
       + `${fmtTime(r.lapDuration)}${dStr}${totalDistStr}</td>`;
  });
  h += '</tr></tbody>';
  tbl.innerHTML = h;
}

function updateSectorHighlight() {
  if (!sectors.length || !runs.length) return;
  runs.forEach(run => {
    const lt = getLapT(run, run.currentIdx);
    let cur = 0;
    for (let i = 0; i < run.sectorTimes.length; i++) {
      if (lt >= run.sectorTimes[i].t_start) cur = i; else break;
    }
    document.querySelectorAll(`[data-sc-rid="${run.id}"]`).forEach((el, i) => {
      el.classList.toggle('sc-active', i === cur);
    });
  });
}

function renderPills() {
  const wrap = document.getElementById('pills-wrap');
  wrap.innerHTML = runs.map(r => {
    const lapOpts = r.laps.map((l,i) =>
      `<option value="${i}"${i===r.selectedLapIdx?' selected':''}>`
      + `${l.num==='Full'?'Full run':`Lap ${l.num}`}`
      + ` (${fmtTime(l.data[l.data.length-1].t - l.data[0].t)})`
      + `</option>`).join('');
    const lapSel = r.laps.length > 1
      ? `<select class="rpill-lap" onchange="changeLap('${r.id}',+this.value)">${lapOpts}</select>`
      : `<span style="font-size:11px;color:var(--muted);padding:0 2px">${r.laps[0].num==='Full'?'Full run':`Lap ${r.laps[0].num}`}</span>`;
    return `<div class="rpill" style="border-color:${r.color}">
      <div class="rpill-dot" style="background:${r.color}"></div>
      <span class="rpill-name">${r.filename.replace(/\.csv$/i,'').substring(0,16)}</span>
      ${lapSel}
      <button class="rpill-del" onclick="removeRun('${r.id}')">×</button>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════════════════════
   GAUGE HELPERS (shared arc math)
════════════════════════════════════════════════════════ */
function gaugeArc(frac, r=75, cx=100, cy=100, sDeg=225, sw=270) {
  frac = Math.max(0, Math.min(1, frac)); if (!frac) return '';
  const toXY = d => { const rd=d*Math.PI/180; return [cx+r*Math.sin(rd),cy-r*Math.cos(rd)]; };
  const [x1,y1]=toXY(sDeg), [x2,y2]=toXY(sDeg+frac*sw);
  return `M ${x1.toFixed(2)},${y1.toFixed(2)} A ${r} ${r} 0 ${frac*sw>180?1:0} 1 ${x2.toFixed(2)},${y2.toFixed(2)}`;
}

/* ════════════════════════════════════════════════════════
   G-FORCE CANVAS (all runs overlaid)
════════════════════════════════════════════════════════ */
function drawGForce() {
  const cv = document.getElementById('gforce-canvas');
  const ctx = cv.getContext('2d');
  const W=cv.width, H=cv.height, cx=W/2, cy=H/2;
  const maxG=1.5, sc=(Math.min(W,H)*0.42)/maxG;

  ctx.clearRect(0,0,W,H); ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,W,H);
  [0.5,1.0,1.5].forEach(g => {
    ctx.beginPath(); ctx.arc(cx,cy,g*sc,0,2*Math.PI);
    ctx.strokeStyle=g===1.5?'#252d38':'#1a2230'; ctx.lineWidth=g===1.5?1.5:1; ctx.stroke();
    ctx.fillStyle='#3a4050'; ctx.font='10px monospace'; ctx.textAlign='left';
    ctx.fillText(`${g}g`,cx+g*sc+3,cy-3);
  });
  ctx.beginPath();
  ctx.moveTo(cx-maxG*sc*1.1,cy); ctx.lineTo(cx+maxG*sc*1.1,cy);
  ctx.moveTo(cx,cy-maxG*sc*1.1); ctx.lineTo(cx,cy+maxG*sc*1.1);
  ctx.strokeStyle='#1a2230'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#3a4050'; ctx.font='10px monospace';
  ctx.textAlign='center';
  ctx.fillText('ACCEL',cx,cy-maxG*sc-7); ctx.fillText('BRAKE',cx,cy+maxG*sc+15);
  ctx.textAlign='right'; ctx.fillText('L',cx-maxG*sc-5,cy+4);
  ctx.textAlign='left';  ctx.fillText('R',cx+maxG*sc+5,cy+4);

  // Trails and dots for each run
  for (const run of runs) {
    const hist = gHistories[run.id] || [];
    hist.forEach((pt,i) => {
      const a = ((i+1)/hist.length)*0.5;
      ctx.beginPath(); ctx.arc(cx+pt.x*sc,cy-pt.y*sc,2,0,2*Math.PI);
      ctx.fillStyle = hexA(run.color, a); ctx.fill();
    });
    const d = run.lapData[run.currentIdx];
    if (d.glat!=null && d.glon!=null) {
      const px=cx+d.glat*sc, py=cy-d.glon*sc;
      ctx.beginPath(); ctx.arc(px,py,6,0,2*Math.PI);
      ctx.fillStyle=run.color; ctx.fill();
      ctx.beginPath(); ctx.arc(px,py,6,0,2*Math.PI);
      ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1.5; ctx.stroke();
    }
  }
}

function hexA(hex, a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ════════════════════════════════════════════════════════
   PER-FRAME DISPLAY UPDATE
════════════════════════════════════════════════════════ */
function updateAllDisplays() {
  const fast = getBaselineRun();

  for (const run of runs) {
    const d = run.lapData[run.currentIdx];
    const lt = getLapT(run, run.currentIdx);

    // Marker
    run.marker?.setLatLng([d.lat, d.lon]);

    // G-force history
    if (!gHistories[run.id]) gHistories[run.id] = [];
    if (d.glat!=null && d.glon!=null) {
      gHistories[run.id].push({x:d.glat, y:d.glon});
      if (gHistories[run.id].length > G_HIST) gHistories[run.id].shift();
    }

    // Live metric row
    const mph    = document.getElementById(`rv-mph-${run.id}`);
    const rpm    = document.getElementById(`rv-rpm-${run.id}`);
    const gear   = document.getElementById(`rv-gear-${run.id}`);
    const thr    = document.getElementById(`rv-thr-${run.id}`);
    const thrPct = document.getElementById(`rv-thr-pct-${run.id}`);
    const brk    = document.getElementById(`rv-brk-${run.id}`);
    const brkPct = document.getElementById(`rv-brk-pct-${run.id}`);
    const sec    = document.getElementById(`rv-sec-${run.id}`);
    const delt   = document.getElementById(`rv-delta-${run.id}`);

    const thrV = Math.min(100, d.thr||0);
    const brkV = Math.min(100, (d.brk||0)/globalMaxBrk*100);

    if (mph)    mph.textContent    = Math.round(d.mph||0);
    if (rpm)    rpm.textContent    = Math.round(d.rpm||0).toLocaleString();
    if (gear)   gear.textContent   = d.gear!=null?(d.gear===0?'N':d.gear):'–';
    if (thr)    thr.style.width    = `${thrV}%`;
    if (thrPct) thrPct.textContent = `${Math.round(thrV)}%`;
    if (brk)    brk.style.width    = `${brkV}%`;
    if (brkPct) brkPct.textContent = `${Math.round(brkV)}%`;

    // Current sector indicator
    if (sec && run.sectorTimes.length) {
      let curSec = 0;
      for (let i=0; i<run.sectorTimes.length; i++) {
        if (lt >= run.sectorTimes[i].t_start) curSec=i; else break;
      }
      sec.textContent = `S${curSec+1}`;
    } else if (sec) sec.textContent = '';

    // Cumulative delta vs fastest
    if (delt && fast && fast !== run && run.sectorTimes.length && fast.sectorTimes.length) {
      let gap = 0;
      for (let i = 0; i < run.sectorTimes.length; i++) {
        const rs = run.sectorTimes[i], rf = fast.sectorTimes[i];
        if (!rs || !rf) continue;
        if (lt >= rs.t_end) gap += rs.duration - rf.duration;
      }
      if (gap !== 0) {
        delt.textContent = (gap>0?'+':'')+( gap/1000).toFixed(2)+'s';
        delt.style.color = gap > 0 ? 'var(--red)' : 'var(--green)';
      } else delt.textContent = '';
    } else if (delt) delt.textContent = '';
  }

  // Sector table highlight
  updateSectorHighlight();

  // G-force canvas
  drawGForce();

  // Slider + time display
  if (!sliderDragging) document.getElementById('time-slider').value = syncedTime;
  document.getElementById('time-disp').textContent = fmtTime(syncedTime);
}

/* ════════════════════════════════════════════════════════
   PLAYBACK ENGINE
════════════════════════════════════════════════════════ */
function animLoop(ts) {
  if (!isPlaying) return;
  if (lastTs !== null) syncedTime += (ts - lastTs) * playbackSpeed;
  lastTs = ts;
  const stopAt = Math.max(...runs.map(r => r.lapDuration + r.timeOffset));
  if (syncedTime >= stopAt) {
    syncedTime = stopAt; isPlaying = false; lastTs = null; updatePlayBtn();
  }
  runs.forEach(r => { r.currentIdx = findLapIdx(r, runT(r)); });
  updateAllDisplays();
  if (isPlaying) rafId = requestAnimationFrame(animLoop);
}

function togglePlay() {
  if (!runs.length) return;
  if (isPlaying) { isPlaying=false; lastTs=null; cancelAnimationFrame(rafId); }
  else {
    const stopAt = Math.max(...runs.map(r => r.lapDuration + r.timeOffset));
    if (syncedTime >= stopAt) { syncedTime=0; runs.forEach(r=>{r.timeOffset=0; r.currentIdx=0; gHistories[r.id]=[];}); }
    isPlaying=true; rafId=requestAnimationFrame(animLoop);
  }
  updatePlayBtn();
}

function stopPlay() {
  isPlaying=false; lastTs=null; cancelAnimationFrame(rafId); syncedTime=0;
  runs.forEach(r=>{r.timeOffset=0; r.currentIdx=0; gHistories[r.id]=[];});
  updatePlayBtn(); if (runs.length) updateAllDisplays();
}

function updatePlayBtn() {
  const btn=document.getElementById('play-btn');
  btn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
  btn.className = 'ctrl-btn'+(isPlaying?' playing':'');
}

function setSpeed(s) {
  playbackSpeed=s;
  document.querySelectorAll('.spd-btn').forEach((b,i)=>b.classList.toggle('active',[1,2,5,10][i]===s));
}

const slider = document.getElementById('time-slider');
slider.addEventListener('mousedown',  ()=>{ sliderDragging=true;  });
slider.addEventListener('touchstart', ()=>{ sliderDragging=true;  });
document.addEventListener('mouseup',  ()=>{ sliderDragging=false; });
document.addEventListener('touchend', ()=>{ sliderDragging=false; });
slider.addEventListener('input', e => {
  syncedTime = parseFloat(e.target.value);
  runs.forEach(r => {
    r.timeOffset = 0;
    r.currentIdx = findLapIdx(r, Math.min(syncedTime, r.lapDuration));
    gHistories[r.id] = [];
  });
  updateAllDisplays();
});

/* ════════════════════════════════════════════════════════
   RUN MANAGEMENT
════════════════════════════════════════════════════════ */
function addRun(allData, filename) {
  if (runs.length >= RUN_COLORS.length) {
    alert(`Maximum ${RUN_COLORS.length} runs supported.`); return;
  }
  const laps = extractLaps(allData);
  if (!laps.length) { alert('No valid lap data found in ' + filename); return; }

  const run = {
    id:            'r' + ridCounter++,
    color:         RUN_COLORS[runs.length % RUN_COLORS.length],
    filename,
    allData,
    laps,
    selectedLapIdx: 0,
    lapData:       null,
    lapT0:         0,
    lapDuration:   0,
    sectorTimes:   [],
    currentIdx:    0,
    timeOffset:    0,
    polylines:     [],
    marker:        null,
  };
  setRunLap(run, 0);  // pick first lap by default

  // If >1 lap, try to pick a "hot lap" (fastest clean lap, not first or last)
  if (laps.length > 2) {
    const durations = laps.map(l => l.data[l.data.length-1].t - l.data[0].t);
    const minDur = Math.min(...durations.slice(1, -1)); // skip first & last laps
    const bestIdx = durations.findIndex((d,i) => i>0 && i<laps.length-1 && d===minDur);
    if (bestIdx > 0) setRunLap(run, bestIdx);
  }

  runs.push(run);
  document.getElementById('clear-btn').disabled = false;
  updateTrimUI();
  buildRunTrack(run);
  fitMapToAllRuns();
  recomputeGlobalMeta();
  recomputeAllSectorTimes();

  renderPills();
  renderRunRows();

  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('stop-btn').disabled = false;
  document.getElementById('play-btn').disabled = false;

  // Show initial state
  runs.forEach(r => { r.currentIdx = findLapIdx(r, Math.min(syncedTime, r.lapDuration)); });
  updateAllDisplays();
}

function removeRun(rid) {
  const idx = runs.findIndex(r => r.id === rid);
  if (idx < 0) return;
  const run = runs[idx];
  if (baselineRunId === rid) baselineRunId = null;
  run.polylines.forEach(p => trackLayer.removeLayer(p));
  if (run.marker) markerLayer.removeLayer(run.marker);
  delete gHistories[rid];
  runs.splice(idx, 1);

  if (!runs.length) {
    syncedTime = 0; maxDuration = 0;
    sectors = []; sectorLayer.clearLayers();
    document.getElementById('stop-btn').disabled = true;
    document.getElementById('play-btn').disabled = true;
    document.getElementById('clear-btn').disabled = true;
    trimStartPos = null; trimFinishPos = null; trimStartLabel = null; trimFinishLabel = null;
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('sector-msg').style.display='none';
    document.getElementById('stbl').style.display='none';
  } else {
    recomputeGlobalMeta();
    recomputeAllSectorTimes();
  }

  renderPills();
  renderRunRows();
  renderSectorTable();
  updateTrimUI();
  if (runs.length) updateAllDisplays();
}

function clearAllRuns() {
  while (runs.length) removeRun(runs[0].id);
}

function changeLap(rid, lapIdx) {
  const run = runs.find(r => r.id === rid);
  if (!run) return;
  setRunLap(run, lapIdx);
  // Re-apply location trim to the new lap data
  if (trimStartPos || trimFinishPos) {
    applyTrim();
  } else {
    buildRunTrack(run);
    fitMapToAllRuns();
    recomputeGlobalMeta();
    recomputeAllSectorTimes();
  }
  renderPills();
  renderRunRows();
  renderSectorTable();
  updateAllDisplays();
}

/* ════════════════════════════════════════════════════════
   FILE HANDLING
════════════════════════════════════════════════════════ */
const fileInput = document.getElementById('file-input');
fileInput.addEventListener('change', e => {
  const files = [...e.target.files]; e.target.value = '';
  processFileQueue(files);
});

const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  processFileQueue([...e.dataTransfer.files].filter(f => f.name.toLowerCase().endsWith('.csv')));
});

const headerDrop = document.getElementById('header-drop');
headerDrop.addEventListener('dragover', e => { e.preventDefault(); headerDrop.classList.add('dragover'); });
headerDrop.addEventListener('dragleave', e => {
  if (!headerDrop.contains(e.relatedTarget)) headerDrop.classList.remove('dragover');
});
headerDrop.addEventListener('drop', e => {
  e.preventDefault(); headerDrop.classList.remove('dragover');
  processFileQueue([...e.dataTransfer.files].filter(f => f.name.toLowerCase().endsWith('.csv')));
});

function setProgress(msg) { document.getElementById('progress-msg').textContent = msg; }

async function loadSampleData() {
  const btn = document.getElementById('sample-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Loading…';
  const samples = [
    '20240811NNJR-Ken Houseal-5.csv',
    '20240811NNJR-Ken Houseal-7.csv'
  ];
  try {
    const files = await Promise.all(samples.map(async name => {
      const res = await fetch(name);
      if (!res.ok) throw new Error(`HTTP ${res.status} for ${name}`);
      const text = await res.text();
      return new File([text], name, { type: 'text/csv' });
    }));
    await processFileQueue(files);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = '⚑ Use Sample Data';
    if (err.message && err.message.includes('Failed to fetch')) {
      setProgress('⚠ Sample data requires a local server. Try: npx serve .');
    } else {
      setProgress('⚠ Could not load sample data: ' + err.message);
    }
  }
}

async function processFileQueue(files) {
  const csvFiles = files.filter(f => f.name.toLowerCase().endsWith('.csv'));
  if (!csvFiles.length) return;
  for (const file of csvFiles) await loadFile(file);
}

function loadFile(file) {
  return new Promise(resolve => {
    setProgress(`⏳ Reading ${file.name}…`);
    const reader = new FileReader();
    reader.onload = e => {
      setProgress(`⏳ Parsing ${file.name}…`);
      setTimeout(() => {
        try {
          const raw = parseRunCSV(e.target.result);
          if (!raw.length) throw new Error('No valid GPS rows');
          setProgress(`⏳ Processing ${raw.length.toLocaleString()} rows…`);
          setTimeout(() => {
            try {
              const data = processData(raw);
              addRun(data, file.name);
              setProgress('');
            } catch(err) { setProgress(''); alert(file.name+': '+err.message); }
            resolve();
          }, 20);
        } catch(err) { setProgress(''); alert(file.name+': '+err.message); resolve(); }
      }, 20);
    };
    reader.onerror = () => { setProgress(''); alert('Could not read '+file.name); resolve(); };
    reader.readAsText(file);
  });
}

/* ════════════════════════════════════════════════════════
   UTILITIES
════════════════════════════════════════════════════════ */
function fmtTime(ms) {
  if (ms==null||isNaN(ms)) return '0:00.000';
  const s=ms/1000, m=Math.floor(s/60), ss=(s%60).toFixed(3).padStart(6,'0');
  return `${m}:${ss}`;
}
function shortName(fn) {
  return fn.replace(/\.csv$/i,'').split('-')[0].substring(0,12);
}

drawGForce();
